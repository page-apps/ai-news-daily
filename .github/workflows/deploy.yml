name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_NEWS_EDITORIAL_REPOSITORY: ${{ vars.NEWS_EDITORIAL_REPOSITORY || 'page-apps/ai-news-daily-editorial' }}
          PUBLIC_NEWS_PUBLIC_REPOSITORY: ${{ github.repository }}
          PUBLIC_NEWS_REVIEWER_LOGIN: ${{ vars.NEWS_REVIEWER_LOGIN || 'cmwen' }}
          PUBLIC_NEWS_EDITORIAL_BRANCH: ${{ vars.NEWS_EDITORIAL_BRANCH || 'main' }}
          PUBLIC_NEWS_PUBLIC_BRANCH: ${{ vars.NEWS_PUBLIC_BRANCH || 'main' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
